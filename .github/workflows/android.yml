name: Android CI
on:
  push:
    branches: [main, "work/**", "fix/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run source HTML extractor tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run core unit tests
        run: gradle :core:test
      - name: Upload core test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relab-core-test-results
          path: core/build/test-results/test/*.xml
          if-no-files-found: warn
  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: relab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  android-instrumentation:
    # Pin a supported LTS runner; ubuntu-latest moved to 26.04 and the
    # hosted emulator repeatedly disappeared from ADB before boot completed.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android launch and relaunch instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 360
          verbose: true
          script: |
            # Separate Gradle/instrumentation sessions with an explicit app force-stop
            # between them exercise real cold process relaunches with the same DB.
            for pass in 1 2 3; do
              echo "Cold-process startup pass $pass/3"
              gradle --rerun-tasks :app:connectedDebugAndroidTest
              if [ "$pass" -lt 3 ]; then
                adb shell am force-stop com.relab.app
                sleep 2
              fi
            done
      - name: Capture emulator diagnostics\n        if: always()\n        continue-on-error: true\n        run: |\n          echo "=== Runner / disk ==="\n          uname -a\n          df -h\n          echo "=== KVM ==="\n          if [ -e /dev/kvm ]; then ls -l /dev/kvm; else echo "/dev/kvm unavailable"; fi\n          echo "=== ADB devices ==="\n          adb devices -l\n          echo "=== Emulator processes ==="\n          ps -ef\n      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relab-android-instrumentation-results
          path: app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn

  capture-canonical-charts:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture nine canonical chart pages
        run: python scripts/capture_canonical_charts.py --output-dir data/captures
      - name: Extract captured weekly charts into source CSV
        run: python scripts/extract_canonical_captures.py --capture-dir data/captures --output data/derived/canonical_observations.csv --summary data/derived/canonical_extraction_summary.json
      - name: Audit extracted market CSV
        run: python scripts/audit_source_csv.py data/derived/canonical_observations.csv --output data/derived/canonical_audit.json --eligible-output data/derived/canonical_eligible_observations.csv
      - name: Run chronological walk-forward evaluation
        run: python scripts/walk_forward_backtest.py data/derived/canonical_eligible_observations.csv --minimum-history 30 --output data/derived/walk_forward_report.json
      - name: Upload immutable HTML snapshots and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relab-canonical-chart-captures
          path: |
            data/captures/
            data/derived/
          if-no-files-found: warn
