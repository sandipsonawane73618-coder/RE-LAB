name: Android CI
on:
  push:
    branches: [main, "work/**", "fix/**", "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install vectorized backtest dependency
        run: python -m pip install numpy==2.2.6
      - name: Run source HTML extractor tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run core unit tests
        run: gradle :core:test
      - name: Run Android app unit tests
        run: gradle :app:testDebugUnitTest
      - name: Upload core test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relab-core-test-results
          path: |
            core/build/test-results/test/*.xml
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
  capture-public-charts-once:
    if: (github.event_name == 'push' && github.event.head_commit.message == 'Run one-time nine-market public chart capture') || (github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.head.ref == 'feature/preloaded-learning-pipeline')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture all nine canonical panel pages
        id: capture
        continue-on-error: true
        run: python scripts/capture_canonical_charts.py --output-dir data/captures --timeout 45
      - name: Extract dated observations and source-quality summary
        id: extract
        if: always()
        continue-on-error: true
        run: python scripts/extract_canonical_captures.py --capture-dir data/captures --output data/derived/canonical_observations.csv --summary data/derived/canonical_extraction_summary.json
      - name: Upload immutable HTML captures and extracted observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relab-nine-market-public-panel-captures
          path: |
            data/captures/**
            data/derived/canonical_observations.csv
            data/derived/canonical_extraction_summary.json
          if-no-files-found: warn
          retention-days: 90
      - name: Require all nine markets to have verified published rows
        if: always()
        run: |
          python - <<'PY'
          import csv
          import json
          import re
          import sys
          from collections import defaultdict
          from datetime import date, datetime
          from pathlib import Path
          summary_path = Path("data/derived/canonical_extraction_summary.json")
          csv_path = Path("data/derived/canonical_observations.csv")
          if not summary_path.is_file() or not csv_path.is_file():
              print("FAIL: extraction summary or observations CSV was not created")
              sys.exit(1)
          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          markets = summary.get("markets", {})
          expected = {
              "SRIDEVI", "SRIDEVI_NIGHT", "KALYAN", "MAIN_BAZAR",
              "TIME_BAZAR", "MILAN_DAY", "MILAN_NIGHT",
              "RAJDHANI_DAY", "RAJDHANI_NIGHT"
          }
          missing = sorted(expected - set(markets))
          insufficient = {
              name: markets.get(name, {}).get("published", 0)
              for name in sorted(expected)
              if markets.get(name, {}).get("capture") != "OK"
              or markets.get(name, {}).get("published", 0) < 30
          }
          required = {
              "market", "session_id", "date", "source_id", "retrieved_at",
              "raw_text", "status", "source_record_id", "source_url", "published_at", "result"
          }
          with csv_path.open(newline="", encoding="utf-8") as handle:
              reader = csv.DictReader(handle)
              missing_columns = sorted(required - set(reader.fieldnames or []))
              rows = list(reader)
          bad_rows = []
          future_rows = []
          date_results = defaultdict(set)
          published_by_market_session = defaultdict(int)
          for line, row in enumerate(rows, start=2):
              if row["market"] not in expected or not row["session_id"] or not row["source_id"] or not row["source_url"]:
                  bad_rows.append(f"row {line}: missing or unknown source identity")
                  continue
              try:
                  chart_date = date.fromisoformat(row["date"])
                  retrieved = datetime.fromisoformat(row["retrieved_at"].replace("Z", "+00:00"))
                  if retrieved.tzinfo is None or retrieved.utcoffset() is None:
                      raise ValueError("retrieved_at has no timezone")
                  if chart_date > retrieved.date():
                      future_rows.append(line)
              except ValueError as error:
                  bad_rows.append(f"row {line}: {error}")
                  continue
              if row["status"] == "PUBLISHED":
                  match = re.fullmatch(r"(\d{3})-(\d{2})-(\d{3})", row["result"])
                  if not match:
                      bad_rows.append(f"row {line}: invalid published result shape")
                      continue
                  opened, jodi, closed = match.groups()
                  expected_jodi = f"{sum(map(int, opened)) % 10}{sum(map(int, closed)) % 10}"
                  if jodi != expected_jodi:
                      bad_rows.append(f"row {line}: Panna/Jodi checksum mismatch")
                      continue
                  published_by_market_session[(row["market"], row["session_id"])] += 1
                  date_results[(row["market"], row["session_id"], row["date"])].add(row["result"])
              elif row["status"] not in {"PENDING", "HOLIDAY_CLOSED", "MISSING_FROM_SOURCE", "MALFORMED"}:
                  bad_rows.append(f"row {line}: unknown observation status {row['status']}")
          thin_sessions = {
              f"{market}/{session}": count
              for (market, session), count in sorted(published_by_market_session.items())
              if count < 30
          }
          conflicts = sum(len(values) > 1 for values in date_results.values())
          publishers = sorted({row["source_id"] for row in rows})
          quality = {
              "markets_expected": 9,
              "markets_with_rows": summary.get("markets_with_rows", 0),
              "total_observations": len(rows),
              "published_observations": sum(published_by_market_session.values()),
              "malformed_observations": sum(row["status"] == "MALFORMED" for row in rows),
              "conflicting_market_dates": conflicts,
              "publishers": publishers,
              "minimum_published_per_market_session": 30,
              "missing_markets": missing,
              "markets_below_minimum": insufficient,
              "sessions_below_minimum": thin_sessions,
              "future_dated_rows": len(future_rows),
              "invalid_rows": bad_rows[:20],
              "missing_columns": missing_columns,
              "failures": summary.get("failures", []),
          }
          print(json.dumps(quality, indent=2))
          if (missing or insufficient or thin_sessions or future_rows or bad_rows or missing_columns
              or summary.get("failures") or summary.get("markets_with_rows") != 9):
              sys.exit(1)
          PY
  historical-learning-backtest:
    needs: [core-tests, capture-public-charts-once]
    if: needs.core-tests.result == 'success' && needs.capture-public-charts-once.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Download the exact nine-market capture artifact
        uses: actions/download-artifact@v4
        with:
          name: relab-nine-market-public-panel-captures
          path: preload-input
      - name: Run chronological Panna, Half-Sangam and Sangam learning audit
        run: |
          gradle :core:runPannaHalfSangamBacktest \
            -PinputCsv=preload-input/derived/canonical_observations.csv \
            -PoutputCsv=data/derived/panna-half-sangam-learning-metrics.csv
      - name: Run chronological Open Panna, Close Panna and Jodi multi-model audit
        run: |
          gradle :core:runMultiModelHistoricalBacktest \
            -PinputCsv=preload-input/derived/canonical_observations.csv \
            -PoutputCsv=data/derived/multi-model-learning-metrics.csv
      - name: Upload historical learning metrics and source audits
        uses: actions/upload-artifact@v4
        with:
          name: relab-historical-learning-results
          path: |
            data/derived/panna-half-sangam-learning-metrics.csv
            data/derived/panna-half-sangam-learning-metrics.audit.txt
            data/derived/multi-model-learning-metrics.csv
            data/derived/multi-model-learning-metrics.audit.txt
          if-no-files-found: error
          retention-days: 90

  # Keep the full device suite intact; run it manually during final APK verification.
  android-instrumentation:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.event.head_commit.message == 'Run Task 16 integrated APK and instrumentation verification')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_I_WANT_MY_TCG: "yes"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android instrumentation regression suite on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace
      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relab-android-instrumentation-results
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug
      - name: Verify APK signature and record checksum
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: relab-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
